name: CI

on:
  push:
    branches: [master]
    paths:
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'

jobs:
  # ── Compile check: engine static lib ─────────────────────────────────────────
  # Public repo → необмежені безкоштовні хвилини.
  # libsdl3-dev відсутній в ubuntu-24.04 стандартних репо → будуємо з source
  # і кешуємо за версією. SDL3 build (~5 хв) відбувається тільки при cache miss
  # (тобто один раз, далі ~10с restore).
  build-linux:
    name: Engine/${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (без SDL3)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake ninja-build ccache \
            liblua5.4-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libegl1-mesa-dev libdrm-dev libgbm-dev

      # SDL3 кешується за тегом версії — rebuild тільки при зміні версії SDL3.
      - name: Cache SDL3
        id: sdl3
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-ubuntu24-3.4.8-static

      - name: Build SDL3 (cache miss only)
        if: steps.sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch release-3.4.8 \
            https://github.com/libsdl-org/SDL SDL3_src
          cmake -S SDL3_src -B SDL3_build \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3
          cmake --build SDL3_build --parallel $(nproc)
          cmake --install SDL3_build

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ matrix.config }}-${{ github.sha }}
          restore-keys: ccache-engine-${{ matrix.config }}-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DUSE_SDL3=ON \
            -DMD_STATIC_DEPS=OFF \
            -DCMAKE_PREFIX_PATH=/opt/sdl3

      - name: Build
        run: ninja -C build monkey_dust_engine

      - name: ccache stats
        run: ccache -s
