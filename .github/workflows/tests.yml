name: Engine Tests (Підхід 3)

on:
  push:
    branches: [master]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch: {}

# ── Підхід 3: тести engine API в public repo ──────────────────────────────────
# 70/76 тестів тестують ТІЛЬКИ engine API (monkey_dust/*) — без game/ коду.
# Перенесені у engine repo → запускаються тут (public, ∞ хв).
# В monkey_dust (private) залишаються тільки 6 game-specific тестів.
#
# Результат:
#   - 70 тестів × ~2 хв = 140 хв/місяць → $0 (public)
#   - 6 тестів  × ~2 хв = 12 хв/місяць  → з private ліміту

jobs:
  test-engine-api:
    name: Tests/${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        sanitizer: [none, asan, ubsan]
        exclude:
          - config: Release
            sanitizer: asan
          - config: Release
            sanitizer: ubsan

    steps:
      - uses: actions/checkout@v4

      - name: Checkout third_party deps
        run: |
          mkdir -p third_party
          git clone --depth=1 https://github.com/skypjack/entt         third_party/entt
          git clone --depth=1 https://github.com/g-truc/glm             third_party/glm
          git clone --depth=1 https://github.com/google/googletest      third_party/googletest
          git clone --depth=1 https://github.com/recastnavigation/recastnavigation third_party/recastnavigation
          git clone --depth=1 --branch v5.1.0 https://github.com/jrouwe/JoltPhysics third_party/JoltPhysics
          git clone --depth=1 https://github.com/guillaumeblanc/ozz-animation third_party/ozz-animation

      # renderdoc_app.h: single header, MIT-licensed, from RenderDoc SDK.
      # Locally found via /usr/include (RenderDoc apt/pacman package) — the
      # CI runner has no such install, so fetch just this one header instead.
      # Pinned to a commit SHA (not the mutable v1.x branch) + checksummed,
      # same reproducibility bar as the JoltPhysics tag pin above.
      - name: Fetch renderdoc_app.h
        run: |
          mkdir -p third_party/renderdoc
          curl -sSfL -o third_party/renderdoc/renderdoc_app.h \
            https://raw.githubusercontent.com/baldurk/renderdoc/f8c90b0032c3e9c87a692ed640b91e53d9c139ee/renderdoc/api/app/renderdoc_app.h
          echo "b7005e7dc34c3635046868bbd76d81b9b055aede0f56daa0bd39fedee0639ffb  third_party/renderdoc/renderdoc_app.h" | sha256sum -c -

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake ninja-build ccache \
            liblua5.4-dev libgtest-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libdrm-dev libgbm-dev

      - name: Cache SDL3
        id: sdl3
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-ubuntu24-3.4.8-static

      - name: Build SDL3
        if: steps.sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch release-3.4.8 \
            https://github.com/libsdl-org/SDL SDL3_src
          cmake -S SDL3_src -B SDL3_build \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF \
            -DSDL_X11_XSCRNSAVER=OFF -DSDL_X11_XTEST=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3
          cmake --build SDL3_build --parallel $(nproc)
          cmake --install SDL3_build

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-tests-${{ matrix.config }}-${{ matrix.sanitizer }}-${{ github.sha }}
          restore-keys: ccache-tests-${{ matrix.config }}-${{ matrix.sanitizer }}-

      - name: Configure
        run: |
          EXTRA="-DMD_STATIC_DEPS=OFF"
          if [ "${{ matrix.sanitizer }}" = "asan"  ]; then EXTRA="$EXTRA -DMD_SANITIZE=ON"; fi
          if [ "${{ matrix.sanitizer }}" = "ubsan" ]; then EXTRA="$EXTRA -DMD_UBSAN=ON";   fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS=-I$(pwd)/third_party/renderdoc \
            -DUSE_SDL3=ON \
            -DCMAKE_PREFIX_PATH=/opt/sdl3 \
            -DMONKEY_DUST_BUILD_TESTS=ON \
            $EXTRA

      - name: Build tests
        run: ninja -C build md_tests

      - name: ccache stats
        run: ccache -s

      - name: Run tests
        working-directory: ${{ github.workspace }}/tests/flare_test
        env:
          BUILD_DIR: ${{ github.workspace }}/build/tests
        run: |
          FAIL=0
          for bin in flare_ini_parser flare_tile_map; do
            echo "=== $bin ==="
            if "${BUILD_DIR}/${bin}"; then
              echo "PASS: $bin"
            else
              echo "FAIL: $bin"; FAIL=$((FAIL+1))
            fi
          done
          exit $FAIL
